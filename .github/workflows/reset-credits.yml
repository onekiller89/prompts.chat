name: Reset Daily Generation Credits

on:
  schedule:
    # Run at midnight UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  reset-credits:
    runs-on: ubuntu-latest
    if: github.repository == 'f/prompts.chat' || github.event_name == 'workflow_dispatch'
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Reset daily generation credits
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::notice::CRON_SECRET is not configured for this repository; skipping credit reset."
            exit 0
          fi

          response=$(curl -s -w "\n%{http_code}" -X POST \
            "https://prompts.chat/api/cron/reset-credits" \
            -H "Authorization: Bearer $CRON_SECRET")
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          echo "Response: $body"
          echo "HTTP Code: $http_code"
          
          if [ "$http_code" != "200" ]; then
            echo "Failed to reset credits"
            exit 1
          fi
          
          echo "Credits reset successfully"
